<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Bias Engine - Pré-Mercado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #12141c; color: #e4e6eb; font-family: 'Segoe UI', sans-serif; }
        .card-market { background-color: #1a1d26; border: 1px solid #2d313f; border-radius: 10px; }
        .text-up { color: #26a69a; font-weight: bold; }
        .text-down { color: #ef5350; font-weight: bold; }
        .text-stable { color: #787b86; }
        .bias-box { border-radius: 12px; padding: 25px; text-align: center; margin-bottom: 30px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="fw-bold text-white mb-4">📊 Trading Bias Dashboard</h2>
        <div class="bias-box bg-{{ dados.classe_cor }} text-white shadow fs-2">
            VIÉS DO DIA: {{ dados.vies }}
        </div>
        <div class="row g-4">
            {% for nome_ativo, info in dados.ativos.items() %}
            <div class="col-md-6 col-lg-3">
                <div class="card card-market p-3 shadow-sm">
                    <div class="text-muted small fw-semibold">{{ nome_ativo }}</div>
                    <div class="fs-3 fw-bold my-2 text-white">${{ info.preco }}</div>
                    <div>
                        {% if info.variacao > 0 %}<span class="text-up">↑ +{{ info.variacao }}%</span>
                        {% elif info.variacao < 0 %}<span class="text-down">↓ {{ info.variacao }}%</span>
                        {% else %}<span class="text-stable">0.00%</span>{% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
